name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version_bump:
        description: "Bump VERSION from commits"
        type: boolean
        default: true
      changelog:
        description: "Master switch for changelog updates"
        type: boolean
        default: true
      changelog_internal:
        description: "Update technical CHANGELOG.md"
        type: boolean
        default: true
      changelog_external:
        description: "Update emoji CHANGELOG.external.md"
        type: boolean
        default: true
      ai_changelog:
        description: "Rewrite changelogs via OpenRouter"
        type: boolean
        default: false
      commit_release:
        description: "Commit release files to main"
        type: boolean
        default: true
      tag_release:
        description: "Push vX.Y.Z tag"
        type: boolean
        default: true
      sequential_bumps:
        description: "Sequential per-commit bumps"
        type: boolean
        default: true
      intermediate_changelog:
        description: "Changelog section per intermediate version"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Load release switches
        id: switches
        env:
          EVENT_NAME: ${{ github.event_name }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            export RELEASE_VERSION_BUMP='${{ inputs.version_bump }}'
            export RELEASE_CHANGELOG='${{ inputs.changelog }}'
            export RELEASE_CHANGELOG_INTERNAL='${{ inputs.changelog_internal }}'
            export RELEASE_CHANGELOG_EXTERNAL='${{ inputs.changelog_external }}'
            export RELEASE_AI_CHANGELOG='${{ inputs.ai_changelog }}'
            export RELEASE_COMMIT_RELEASE='${{ inputs.commit_release }}'
            export RELEASE_TAG_RELEASE='${{ inputs.tag_release }}'
            export RELEASE_SEQUENTIAL_BUMPS='${{ inputs.sequential_bumps }}'
            export RELEASE_INTERMEDIATE_CHANGELOG='${{ inputs.intermediate_changelog }}'
          fi
          bash .github/scripts/load-release-config.sh

      - name: Check if release is needed
        id: check
        run: |
          if [[ "${{ steps.switches.outputs.RELEASE_VERSION_BUMP }}" != "true" \
            && "${{ steps.switches.outputs.RELEASE_CHANGELOG_INTERNAL }}" != "true" \
            && "${{ steps.switches.outputs.RELEASE_CHANGELOG_EXTERNAL }}" != "true" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Skipping: version_bump and both changelogs are disabled."
            exit 0
          fi

          HEAD_SUBJECT="$(git log -1 --format=%s HEAD)"
          if [[ "$HEAD_SUBJECT" =~ ^chore\(release\): ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Skipping: HEAD is already a release commit."
            exit 0
          fi

          LAST_RELEASE_SHA="$(git log --format=%H HEAD --no-merges | while read -r sha; do
            if [[ $(git log -1 --format=%s "$sha") =~ ^chore\(release\): ]]; then
              echo "$sha"
              break
            fi
          done)"

          if [ -n "$LAST_RELEASE_SHA" ]; then
            ANALYZE_RANGE="${LAST_RELEASE_SHA}..HEAD"
          else
            ROOT_SHA="$(git rev-list --max-parents=0 HEAD)"
            ANALYZE_RANGE="${ROOT_SHA}..HEAD"
          fi

          echo "analyze_range=${ANALYZE_RANGE}" >> "$GITHUB_OUTPUT"

          NEW_COUNT="$(git rev-list --count --no-merges "${ANALYZE_RANGE}" 2>/dev/null || echo 0)"
          if [ "$NEW_COUNT" -eq 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Skipping: no releasable commits since last release."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Will release ${NEW_COUNT} commit(s) from: ${ANALYZE_RANGE}"
          fi

      - name: Bump VERSION and CHANGELOG on main
        if: steps.check.outputs.skip != 'true'
        id: bump
        env:
          ANALYZE_RANGE: ${{ steps.check.outputs.analyze_range }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ steps.switches.outputs.OPENROUTER_MODEL }}
          RELEASE_VERSION_BUMP: ${{ steps.switches.outputs.RELEASE_VERSION_BUMP }}
          RELEASE_CHANGELOG: ${{ steps.switches.outputs.RELEASE_CHANGELOG }}
          RELEASE_CHANGELOG_INTERNAL: ${{ steps.switches.outputs.RELEASE_CHANGELOG_INTERNAL }}
          RELEASE_CHANGELOG_EXTERNAL: ${{ steps.switches.outputs.RELEASE_CHANGELOG_EXTERNAL }}
          RELEASE_AI_CHANGELOG: ${{ steps.switches.outputs.RELEASE_AI_CHANGELOG }}
          RELEASE_AI_CHANGELOG_FALLBACK: ${{ steps.switches.outputs.RELEASE_AI_CHANGELOG_FALLBACK }}
          RELEASE_SEQUENTIAL_BUMPS: ${{ steps.switches.outputs.RELEASE_SEQUENTIAL_BUMPS }}
          RELEASE_INTERMEDIATE_CHANGELOG: ${{ steps.switches.outputs.RELEASE_INTERMEDIATE_CHANGELOG }}
        run: bash .github/scripts/bump-version.sh

      - name: Commit release to main
        if: steps.check.outputs.skip != 'true' && steps.switches.outputs.RELEASE_COMMIT_RELEASE == 'true'
        id: commit
        run: |
          git add VERSION CHANGELOG.md CHANGELOG.external.md 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "released=false" >> "$GITHUB_OUTPUT"
            echo "No version file changes produced."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          NEW_VERSION="$(tr -d '[:space:]' < VERSION)"
          git commit -m "chore(release): bump version to ${NEW_VERSION}"
          git push origin main
          echo "released=true" >> "$GITHUB_OUTPUT"
          echo "new_version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Tag release on main
        if: >-
          steps.check.outputs.skip != 'true'
          && steps.switches.outputs.RELEASE_TAG_RELEASE == 'true'
          && steps.commit.outputs.released == 'true'
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          VERSION="${VERSION#v}"
          TAG="v${VERSION}"

          git fetch origin --tags

          if git rev-parse "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists locally."
            exit 0
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists on remote."
            exit 0
          fi

          git tag -a "${TAG}" -m "Release ${VERSION}"
          git push origin "${TAG}"
          echo "Created and pushed tag ${TAG}"
