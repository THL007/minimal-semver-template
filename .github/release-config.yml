# Release feature switches for CI.
# Env overrides (optional): RELEASE_<KEY_IN_UPPERCASE>=true|false
# Example: RELEASE_AI_CHANGELOG=true

# Bump VERSION from commit history (sequential unless sequential_bumps is false)
version_bump: true

# Master switch for both changelog files (false disables internal + external)
changelog: true

# Technical Keep a Changelog notes → CHANGELOG.md
changelog_internal: true

# Simple emoji user-facing notes → CHANGELOG.external.md
changelog_external: true

# Rewrite changelogs via OpenRouter (needs OPENROUTER_API_KEY secret)
ai_changelog: false

# If AI fails, keep the heuristic changelog instead of failing the job
ai_changelog_fallback: true

# Commit VERSION/CHANGELOG* back to main as chore(release):
commit_release: true

# Push annotated tag vX.Y.Z for the final version (requires commit_release)
tag_release: true

# Apply one bump per commit oldest→newest (false = single highest bump)
sequential_bumps: true

# One changelog section per intermediate version (false = final version only)
intermediate_changelog: true

# OpenRouter model id (also overridable via OPENROUTER_MODEL / RELEASE_OPENROUTER_MODEL)
openrouter_model: openai/gpt-4o-mini
